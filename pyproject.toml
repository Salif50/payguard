[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payguard"
version = "1.0.0"
description = "Simulation d'un système de paiement mobile (GNF) et détection de fraude par règles métier."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Équipe PayGuard (binôme Master 1 IASD)" }]
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
notebook = [
    "jupyter",
]

[project.scripts]
payguard = "payguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["payguard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
